name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Test the application
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v7

      - name: Golang environment
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod',
          cache: true
        
      - name: Run tests
        run: go test -v -race ./...


